name: deploy-website

# Publish the website/ folder to GitHub Pages on every push to main.
# (If you'd rather use Cloudflare Pages, connect this repo there with output dir = website and skip
#  this workflow. For a custom domain like get.vclaw.ai, set it in repo Settings → Pages, or add a
#  website/CNAME file containing the domain.)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
